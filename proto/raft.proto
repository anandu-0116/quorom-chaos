syntax = "proto3";

package quorumchaos;

// Raft leader-election RPCs only. No log entries yet: AppendEntries is a
// heartbeat, and RequestVote carries no last-log fields since there is no
// log to compare against. Both are additive, non-breaking proto changes to
// make later once log replication exists.
service Raft {
  rpc RequestVote(RequestVoteArgs) returns (RequestVoteReply);
  rpc AppendEntries(AppendEntriesArgs) returns (AppendEntriesReply);

  // Pre-Vote (Raft dissertation §4.2.3/§9.6): a side-effect-free canvass a
  // node runs before bumping its real term and starting a real election.
  // Reuses RequestVoteArgs/Reply -- same question, no commitment. Prevents
  // a node that's merely network-partitioned (not crashed) from inflating
  // currentTerm while it can't reach anyone, which would otherwise let it
  // disrupt a healthy leader the moment the partition heals.
  rpc RequestPreVote(RequestVoteArgs) returns (RequestVoteReply);
}

message RequestVoteArgs {
  int64 term = 1;
  string candidate_id = 2;
}

message RequestVoteReply {
  int64 term = 1;
  bool vote_granted = 2;
}

// Heartbeat-only: no `entries` field yet.
message AppendEntriesArgs {
  int64 term = 1;
  string leader_id = 2;
}

message AppendEntriesReply {
  int64 term = 1;
  bool success = 2;
}
